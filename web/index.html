<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gmrecomp</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #101012;
        --panel: #1a1a1e;
        --line: #2c2c33;
        --fg: #ececf1;
        --muted: #8d8d99;
        --accent: #e8b44a;
        --stage: #000;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f4f3ef; --panel: #ffffff; --line: #dcdad3; --fg: #1d1c19; --muted: #6c6a62; --accent: #a8700f; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
      a { color: inherit; }
      button, label.button {
        font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 10px; cursor: pointer;
      }
      button:hover, label.button:hover { border-color: var(--muted); }
      [hidden] { display: none !important; }

      /* library */
      #library { max-width: 960px; margin: 0 auto; padding: 40px 16px 64px; }
      #library h1 { margin: 0; font: 600 26px/1.2 ui-monospace, monospace; letter-spacing: -0.02em; }
      #library h1 span { color: var(--accent); }
      #library .lede { margin: 6px 0 28px; color: var(--muted); }
      #games, #localgames { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
      #games a, #localgames a {
        display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 16px; text-decoration: none;
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      }
      #games a:hover, #localgames a:hover { border-color: var(--accent); }
      #games .title, #localgames .title { font-weight: 600; font-size: 16px; }
      #games .meta, #localgames .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; align-items: center; }
      #library .import { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 16px; }
      #importstatus { color: var(--muted); font-size: 13px; }
      .badge { font: 12px/1 ui-monospace, monospace; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
      .badge.saved { color: var(--accent); border-color: currentColor; }
      #games li.unsupported a { opacity: 0.55; }
      #games li.unsupported a:hover { border-color: var(--line); }
      #empty { color: var(--muted); }

      /* player */
      #player { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--stage); }
      #bar {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg);
        border-bottom: 1px solid var(--line); flex-wrap: wrap;
      }
      #bar .name { font-weight: 600; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #bar a.back { text-decoration: none; color: var(--muted); font-size: 13px; }
      #bar a.back:hover { color: var(--fg); }
      #stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
      #screen { display: block; image-rendering: pixelated; background: #000; }
      #status {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #b9b9c2;
        font: 13px/1.4 ui-monospace, monospace; text-align: center; max-width: 90%;
      }
      #hint {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px;
        background: rgba(20, 20, 24, 0.85); color: #d9d9e0; font-size: 13px; pointer-events: none;
      }
      #log {
        position: absolute; right: 0; top: 0; bottom: 0; width: min(520px, 100%); margin: 0; padding: 10px; overflow: auto;
        background: rgba(10, 10, 12, 0.92); color: #a9a9b3; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap;
      }
      #stats {
        position: absolute; left: 8px; top: 8px; margin: 0; padding: 6px 9px; border-radius: 6px; pointer-events: none;
        background: rgba(10, 10, 12, 0.8); color: #cfe9cf; font: 12px/1.45 ui-monospace, monospace; white-space: pre;
      }
      body.fullscreen #bar { display: none; }

      /* mods */
      #mods { max-width: min(560px, calc(100vw - 32px)); padding: 0; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
      #mods::backdrop { background: rgba(0, 0, 0, 0.55); }
      #mods form { display: flex; flex-direction: column; gap: 14px; padding: 18px; margin: 0; }
      #mods h2 { margin: 0; font-size: 17px; }
      #mods .none { color: var(--muted); margin: 0; }
      #mods fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
      #mods fieldset.off .opts { opacity: 0.5; }
      #mods legend { padding: 0 4px; }
      #mods legend label { font-weight: 600; display: flex; gap: 8px; align-items: center; cursor: pointer; }
      #mods .about { color: var(--muted); font-size: 13px; margin: 0; }
      #mods .opts { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
      #mods .opts label { display: flex; gap: 8px; align-items: center; }
      #mods .opts input[type=text], #mods .opts input[type=number] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; flex: 1; }
      #mods .buttons { display: flex; gap: 8px; justify-content: flex-end; }
      #mods .buttons .primary { border-color: var(--accent); color: var(--accent); }
      .badge.mods { color: var(--accent); border-color: currentColor; }

      /* keys */
      #keys { width: min(480px, calc(100vw - 32px)); padding: 0; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
      #keys::backdrop { background: rgba(0, 0, 0, 0.55); }
      #keys form { display: flex; flex-direction: column; gap: 12px; padding: 18px; margin: 0; }
      #keys h2 { margin: 0; font-size: 17px; }
      #keys .km-about { margin: 0; color: var(--muted); font-size: 13px; }
      #keys .km-table { display: flex; flex-direction: column; gap: 4px; max-height: 55vh; overflow: auto; }
      #keys .km-row { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; font-size: 13px; }
      #keys .km-head { color: var(--muted); font-size: 12px; }
      #keys .km-game { font-weight: 600; }
      #keys .km-keys { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      #keys .km-none { color: var(--muted); }
      #keys .km-key, #keys .km-add { padding: 2px 8px; font-size: 12px; }
      #keys .km-listen { border-color: var(--accent); color: var(--accent); }
      #keys .km-scope { display: flex; gap: 16px; font-size: 13px; }
      #keys .km-buttons { display: flex; gap: 8px; justify-content: flex-end; }
      #keys .km-buttons .primary { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <main id="library" hidden>
      <h1>gm<span>recomp</span></h1>
      <p class="lede">GameMaker games, recompiled from their original executables to run in the browser.</p>
      <p class="import">
        <label class="button" title="A zip, 7z or RAR of the game as it was released (an IExpress package inside is unwrapped)">Import a game…<input id="importgame" type="file" accept=".zip,.7z,.rar,application/zip,application/x-7z-compressed,application/vnd.rar" hidden /></label>
        <span id="importstatus"></span>
      </p>
      <ul id="localgames"></ul>
      <ul id="games"></ul>
      <p id="empty" hidden>No games yet. Import one above, or with <code>importer import … --out web/public/games</code>.</p>
    </main>

    <div id="player" hidden>
      <div id="bar">
        <a class="back" href="./">← Games</a>
        <span class="name" id="name"></span>
        <button id="scale" title="Integer scaling keeps pixels square and sharp">Scale: integer</button>
        <button id="export">Export saves</button>
        <label class="button" title="Load saves exported earlier (restarts the game)">Import saves<input id="import" type="file" accept=".json,application/json" hidden /></label>
        <button id="wipe">Delete saves</button>
        <button id="modsbtn" title="Change the game before it starts (restarts it)" hidden>Mods</button>
        <button id="keysbtn" title="Keys you press reach the game as other keys">Keys</button>
        <button id="statsbtn" title="Frame rate, frame time and input latency">Stats</button>
        <button id="logbtn">Log</button>
        <button id="fs" title="F4">Fullscreen</button>
      </div>
      <div id="stage">
        <canvas id="screen" width="640" height="480"></canvas>
        <div id="status">Loading…</div>
        <div id="hint" hidden>Click or press a key to turn on sound</div>
        <pre id="log" hidden></pre>
        <pre id="stats" hidden></pre>
      </div>
    </div>

    <dialog id="mods"><form method="dialog"></form></dialog>
    <dialog id="keys"></dialog>

    <script type="module">
      import { deleteGame, deleteSaves, exportSaves, listGames, loadGame, loadSaves, openSaves, parseSaves, storeGame, storeSaves } from './src/saves.mjs';
      import { editKeymap, loadKeymap } from './src/keymap.mjs';
      import { playGame } from './src/player.mjs';
      import { loadChoices, modsFor, saveChoices, selectedMods } from './src/mods.mjs';

      /** The mods dialog for a game; `saved()` runs after its choices were stored. */
      function openMods(slug, title, engine, saved) {
        const dlg = document.getElementById('mods');
        const form = dlg.querySelector('form');
        form.replaceChildren();
        const h = document.createElement('h2');
        h.textContent = `Mods · ${title}`;
        form.append(h);
        const choices = loadChoices(slug);
        const mods = modsFor(engine);
        if (!mods.length) {
          const p = document.createElement('p');
          p.className = 'none';
          p.textContent = 'No mods work with this game’s engine.';
          form.append(p);
        }
        const inputs = [];
        for (const m of mods) {
          const c = choices[m.id] ?? {};
          const fs = document.createElement('fieldset');
          const legend = document.createElement('legend');
          const label = document.createElement('label');
          const on = document.createElement('input');
          on.type = 'checkbox';
          on.checked = !!c.on;
          label.append(on, m.name);
          legend.append(label);
          const about = document.createElement('p');
          about.className = 'about';
          about.textContent = m.about;
          const opts = document.createElement('div');
          opts.className = 'opts';
          const fields = [];
          for (const o of m.options) {
            if (o.applies && !o.applies(engine)) continue;
            const row = document.createElement('label');
            const input = document.createElement('input');
            const value = c.config?.[o.key] ?? o.default;
            if (o.type === 'bool') {
              input.type = 'checkbox';
              input.checked = !!value;
              row.append(input, o.label);
            } else {
              input.type = o.type === 'number' ? 'number' : 'text';
              if (o.type === 'number') input.step = 'any';
              input.value = String(value);
              row.append(o.label, input);
            }
            fields.push([o, input]);
            opts.append(row);
          }
          const sync = () => fs.classList.toggle('off', !on.checked);
          on.addEventListener('change', sync);
          sync();
          fs.append(legend, about);
          if (fields.length) fs.append(opts);
          form.append(fs);
          inputs.push([m, on, fields]);
        }
        const buttons = document.createElement('div');
        buttons.className = 'buttons';
        const cancel = document.createElement('button');
        cancel.value = 'cancel';
        cancel.textContent = 'Cancel';
        const save = document.createElement('button');
        save.value = 'save';
        save.className = 'primary';
        save.textContent = 'Save';
        buttons.append(cancel, save);
        form.append(buttons);
        dlg.onclose = () => {
          if (dlg.returnValue !== 'save') return;
          const next = { ...choices };
          for (const [m, on, fields] of inputs) {
            const config = { ...(choices[m.id]?.config ?? {}) };
            for (const [o, input] of fields) config[o.key] = o.type === 'bool' ? input.checked : o.type === 'number' ? Number(input.value) : input.value;
            next[m.id] = { on: on.checked, config };
          }
          saveChoices(slug, next);
          saved?.();
        };
        dlg.returnValue = '';
        dlg.showModal();
      }

      /** A "Mods" button and badge for a library card (none when no mod fits the engine). */
      function modsControls(meta, slug, title, engine) {
        if (!modsFor(engine).length) return;
        const badge = document.createElement('span');
        badge.className = 'badge mods';
        badge.textContent = 'mods on';
        const refresh = () => (badge.hidden = selectedMods(loadChoices(slug), engine).length === 0);
        const btn = document.createElement('button');
        btn.textContent = 'Mods';
        btn.title = 'Choose mods for this game';
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          openMods(slug, title, engine, refresh);
        });
        refresh();
        meta.append(btn, badge);
      }

      // ?game=<slug> plays a game; test options: &frames=N &epoch=S &report=1 &capture=30,60
      // &stats (overlay) &pacing=clock|jit|asap (other frame pacing; the default follows the
      // guest's clock with blocking waits)
      // &nopace=1 &script=100:Enter:1,105:Enter:0 (or f:mouse:x:y:b) &audio=1 &nosave=1
      // &monitor: the dev server records the session (start, saves, input as the guest
      // took it, stats, slow frames) in target/monitor/, for `harness run --replay`
      // &replay=<session>: plays a recorded session again (its date, saves and input)
      // &noprofile: no translation profile (functions earlier sessions needed, translated ahead)
      // &nomods: without the mods chosen for the game (src/mods.mjs); &mods=a,b: with exactly these
      // ?zip=<url>: imports the game in that archive (zip, 7z or RAR) into this browser and plays it;
      // &local plays a game imported in this browser
      const q = new URLSearchParams(location.search);
      const game = q.get('game');

      const runnable = (e) => e && (e.kind === 'gm80' || e.kind === 'gm81' || e.kind === 'gms');
      function engineLabel(e) {
        if (!e) return 'unknown engine';
        if (e.kind === 'gm80') return 'GameMaker 8.0';
        if (e.kind === 'gm81') return 'GameMaker 8.1';
        if (e.kind === 'gms') {
          const build = e.version && e.version[3] && e.version[3] !== 9999 ? `.${e.version[3]}` : '';
          return `GameMaker: Studio 1.4${build}${e.yyc ? ' · YYC' : ''}`;
        }
        return e.kind;
      }

      const local = q.has('local');
      if (q.get('zip')) importFrom(q.get('zip'));
      else if (game) play(game);
      else library();

      /** Imports an archive (bytes) into this browser; returns the game's slug. */
      async function importGame(bytes, name, progress) {
        const { importArchive } = await import('./src/import.mjs');
        const { manifest, files } = await importArchive(bytes, name, progress);
        if (!runnable(manifest.engine)) throw new Error(`${manifest.title}: ${engineLabel(manifest.engine)} games are not supported`);
        progress(`storing ${manifest.title}`);
        await storeGame(await openSaves(), manifest.slug, { manifest, files });
        return manifest.slug;
      }

      async function importFrom(url) {
        document.getElementById('player').hidden = false;
        const status = document.getElementById('status');
        try {
          status.textContent = `Downloading ${url}…`;
          const r = await fetch(url);
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const bytes = new Uint8Array(await r.arrayBuffer());
          const name = decodeURIComponent(new URL(url, location.href).pathname.split('/').pop() || 'game.zip');
          const slug = await importGame(bytes, name, (t) => (status.textContent = t));
          // (the other options stay)
          const next = new URLSearchParams(q);
          next.delete('zip');
          next.set('game', slug);
          next.set('local', '');
          location.replace(`?${next}`);
        } catch (e) {
          status.textContent = `Import failed: ${e.message ?? e}`;
        }
      }

      async function library() {
        document.getElementById('library').hidden = false;
        let games = [];
        try {
          const r = await fetch('games/index.json');
          if (r.ok) games = await r.json();
        } catch {}
        const list = document.getElementById('games');
        document.getElementById('empty').hidden = games.length > 0;
        const badges = new Map();
        for (const g of games) {
          const li = document.createElement('li');
          const ok = runnable(g.engine);
          li.className = ok ? '' : 'unsupported';
          const a = document.createElement('a');
          a.href = `?game=${encodeURIComponent(g.slug)}`;
          const title = document.createElement('span');
          title.className = 'title';
          title.textContent = g.title || g.slug;
          const meta = document.createElement('span');
          meta.className = 'meta';
          const badge = (text, cls = '') => {
            const b = document.createElement('span');
            b.className = `badge ${cls}`;
            b.textContent = text;
            meta.append(b);
          };
          badge(engineLabel(g.engine));
          if (!ok) badge('not playable yet');
          else modsControls(meta, g.slug, g.title || g.slug, g.engine);
          a.append(title, meta);
          li.append(a);
          list.append(li);
          badges.set(g.slug, badge);
        }
        // Games imported in this browser, and importing more.
        const importStatus = document.getElementById('importstatus');
        document.getElementById('importgame').addEventListener('change', async (ev) => {
          const file = ev.target.files[0];
          if (!file) return;
          try {
            const slug = await importGame(new Uint8Array(await file.arrayBuffer()), file.name, (t) => (importStatus.textContent = t));
            location.href = `?game=${encodeURIComponent(slug)}&local`;
          } catch (e) {
            importStatus.textContent = `Import failed: ${e.message ?? e}`;
          }
        });
        try {
          const db = await openSaves();
          const localList = document.getElementById('localgames');
          for (const m of await listGames(db)) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = `?game=${encodeURIComponent(m.slug)}&local`;
            const t = document.createElement('span');
            t.className = 'title';
            t.textContent = m.title || m.slug;
            const meta = document.createElement('span');
            meta.className = 'meta';
            for (const text of [engineLabel(m.engine), 'imported here']) {
              const b = document.createElement('span');
              b.className = 'badge';
              b.textContent = text;
              meta.append(b);
            }
            const del = document.createElement('button');
            del.textContent = 'Remove';
            del.title = 'Remove this imported game (its saves stay)';
            del.addEventListener('click', async (e) => {
              e.preventDefault();
              await deleteGame(db, m.slug);
              li.remove();
            });
            meta.append(del);
            modsControls(meta, m.slug, m.title || m.slug, m.engine);
            a.append(t, meta);
            li.append(a);
            localList.append(li);
          }
          if (localList.children.length) document.getElementById('empty').hidden = true;
        } catch {}
        // Mark the games that have saves (after the list is up).
        try {
          const db = await openSaves();
          for (const [slug, badge] of badges) {
            loadSaves(db, slug).then((s) => s.some((e) => e.data) && badge('saved', 'saved')).catch(() => {});
          }
        } catch {}
      }

      async function play(game) {
        const frames = Number(q.get('frames') ?? 0);
        const epoch = q.has('epoch') ? Number(q.get('epoch')) : Math.floor(Date.now() / 1000);
        // (monitor: the session's first line, for replays)
        const report = q.has('report');
        const capture = (q.get('capture') ?? '').split(',').filter(Boolean).map(Number);
        const pace = !q.has('nopace');
        const persist = !q.has('nosave');
        const script = (q.get('script') ?? '').split(',').filter(Boolean).map((s) => {
          const p = s.split(':');
          if (p[1] === 'mouse') return [Number(p[0]), 'mouse', Number(p[2]), Number(p[3]), Number(p[4])];
          return [Number(p[0]), p[1], p[2] === '1', p[3] === 'n']; // frame:code:1|0[:n = NumLock on]
        });

        document.getElementById('player').hidden = false;
        const screen = document.getElementById('screen');
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        const hint = document.getElementById('hint');
        const send = (path, body) => report && fetch(path, { method: 'POST', body }).catch(() => {});
        send('/log', `userAgent: ${navigator.userAgent}\ncrossOriginIsolated: ${self.crossOriginIsolated}`);
        // Monitor mode: lines batched to the dev server every half second.
        const monitor = q.has('monitor');
        const session = `${game}-${new Date().toISOString().replace(/[:.]/g, '-')}`;
        let monitorLines = [];
        const monitorSend = (line) => monitor && monitorLines.push(line);
        const monitorFlush = () => {
          if (!monitorLines.length) return;
          const body = monitorLines.join('\n') + '\n';
          monitorLines = [];
          fetch(`/monitor?s=${encodeURIComponent(session)}`, { method: 'POST', body }).catch(() => {});
        };
        if (monitor) {
          setInterval(monitorFlush, 500);
          window.addEventListener('pagehide', monitorFlush);
        }

        let title = game;
        (local ? openSaves().then((db) => loadGame(db, game)).then((g) => g.manifest) : fetch(`games/${encodeURIComponent(game)}/manifest.json`).then((r) => r.json()))
          .then((m) => {
            title = m.title || game;
            document.getElementById('name').textContent = title;
            document.title = `${title} · gmrecomp`;
            const modsBtn = document.getElementById('modsbtn');
            modsBtn.hidden = !runnable(m.engine) || !modsFor(m.engine).length;
            modsBtn.onclick = () => openMods(game, title, m.engine, () => location.reload());
          })
          .catch(() => {});

        // Scaling: the largest whole multiple that fits (or any fit), centered.
        let gameW = 640, gameH = 480;
        let integer = true;
        const fit = () => {
          const stage = document.getElementById('stage').getBoundingClientRect();
          let s = Math.min(stage.width / gameW, stage.height / gameH);
          if (integer && s >= 1) s = Math.floor(s);
          screen.style.width = `${Math.max(1, Math.round(gameW * s))}px`;
          screen.style.height = `${Math.max(1, Math.round(gameH * s))}px`;
        };
        window.addEventListener('resize', fit);
        document.getElementById('scale').onclick = (e) => {
          integer = !integer;
          e.target.textContent = `Scale: ${integer ? 'integer' : 'fit'}`;
          fit();
        };
        const toggleFullscreen = () => {
          if (document.fullscreenElement) document.exitFullscreen?.();
          else document.getElementById('player').requestFullscreen?.();
        };
        document.getElementById('fs').onclick = toggleFullscreen;
        document.addEventListener('fullscreenchange', () => {
          document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
          requestAnimationFrame(fit);
        });
        document.getElementById('logbtn').onclick = () => (logEl.hidden = !logEl.hidden);
        // Stats overlay (remembered per browser; ?stats shows it too).
        const statsEl = document.getElementById('stats');
        const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
        const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
        statsEl.hidden = !(q.has('stats') || recall('gmr.stats') === '1');
        document.getElementById('statsbtn').onclick = () => {
          statsEl.hidden = !statsEl.hidden;
          remember('gmr.stats', statsEl.hidden ? '0' : '1');
        };
        if (q.has('log')) logEl.hidden = false;
        fit();

        // Saves.
        const saveDb = persist ? openSaves().catch(() => null) : Promise.resolve(null);
        document.getElementById('export').onclick = async () => {
          const db = await saveDb;
          const saves = db ? await loadSaves(db, game) : [];
          if (!saves.length) return alert('This game has no saves yet.');
          const url = URL.createObjectURL(new Blob([exportSaves(game, saves)], { type: 'application/json' }));
          const a = Object.assign(document.createElement('a'), { href: url, download: `${game}-saves.json` });
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
        document.getElementById('import').onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const entries = parseSaves(await file.text(), game);
            const db = await saveDb;
            if (!db) throw new Error('saves are not available in this browser');
            if (!confirm(`Replace this game's saves with ${file.name} and restart?`)) return;
            await deleteSaves(db, game);
            await storeSaves(db, game, entries);
            location.reload();
          } catch (err) {
            alert(`Could not import: ${err.message}`);
          }
        };
        document.getElementById('wipe').onclick = async () => {
          const db = await saveDb;
          if (!db || !confirm(`Delete every save of ${title} and restart?`)) return;
          await deleteSaves(db, game);
          location.reload();
        };

        statusEl.textContent = 'Downloading…';
        // &mods=a,b: exactly these mods this time (with their stored settings)
        let modChoices = q.has('nomods') ? {} : loadChoices(game);
        if (q.has('mods')) {
          const on = q.get('mods').split(',').filter(Boolean);
          modChoices = Object.fromEntries(on.map((id) => [id, { on: true, config: modChoices[id]?.config ?? {} }]));
        }
        const pacing = ['asap', 'jit', 'clock'].includes(q.get('pacing')) ? q.get('pacing') : 'sync';
        // a recorded session to replay: its date, saves and input
        let replay = null;
        let runEpoch = epoch;
        if (q.has('replay')) {
          const text = await (await fetch(`/monitor/${encodeURIComponent(q.get('replay'))}.log`)).text();
          replay = { saves: [], input: [] };
          const unhex = (h) => Uint8Array.from({ length: h.length >> 1 }, (_, i) => parseInt(h.substr(2 * i, 2), 16));
          for (const line of text.split('\n')) {
            const w = line.split(' ');
            if (w[0] === 'start') runEpoch = Number((w.find((t) => t.startsWith('epoch=')) ?? 'epoch=0').slice(6)) || epoch;
            else if (w[0] === 'save') replay.saves.push({ path: w[1].replaceAll('%20', ' '), data: unhex(w[2] ?? ''), mtime: 0 });
            else if (w[0] === 'deleted') replay.saves.push({ path: w[1].replaceAll('%20', ' '), data: null, mtime: 0 });
            else if (w[0] === 'input' && (w[3] === 'key' || w[3] === 'mouse')) replay.input.push([w[3] === 'key' ? 0 : 1, Number(w[1]), Number(w[2]), ...w.slice(4, 7).map(Number)]);
          }
        }
        monitorSend(`start game=${game} epoch=${runEpoch} ua=${navigator.userAgent.replaceAll(' ', '_')}`);
        // A test run (frames, report, replay) stays on the page when the game ends; a
        // played one goes back to where it was started from.
        const testRun = frames > 0 || report || !!replay;
        const back = () => {
          if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) history.back();
          else location.href = './';
        };
        const player = playGame({
          game,
          local,
          canvas: screen,
          frames,
          epoch: runEpoch,
          capture,
          pace,
          pacing,
          ahead: !q.has('noahead'),
          script,
          persist: persist && !replay,
          monitor,
          replay,
          slowMs: q.has('slow') ? Number(q.get('slow')) : undefined,
          useProfile: !q.has('noprofile'),
          modChoices,
          audio: q.has('audio'),
          // &keymap=KeyA:ShiftLeft,...: this map instead of the stored one (tests)
          keymap: q.has('keymap') ? Object.fromEntries(q.get('keymap').split(',').filter(Boolean).map((p) => p.split(':'))) : loadKeymap(game).map,
          // F4: the browser's full screen (a game's own full-screen switch only resizes its window here)
          pageKeys: { F4: toggleFullscreen },
          onLog(line) {
            logEl.textContent += line + '\n';
            send('/log', line);
            monitorSend(`log ${line}`);
            if (line.startsWith('downloaded') || line.startsWith('loaded')) statusEl.textContent = 'Starting…';
          },
          onSoundPending: (waiting) => (hint.hidden = !waiting),
          onSize(w, h) {
            [gameW, gameH] = [w, h];
            statusEl.hidden = true;
            fit();
          },
          onMonitor: monitorSend,
          onStats(data) {
            const f = (v) => v.toFixed(1);
            statsEl.textContent =
              `${f(data.fps)} fps   frame ${f(data.interval)} ms (max ${f(data.intervalMax)})\n` +
              `guest ${f(data.busy)} ms per frame (max ${f(data.busyMax)})   late ${data.late}   wake +${f(data.wake)} ms (max ${f(data.wakeMax)})\n` +
              (data.inputs ? `input → frame ${f(data.input)} ms (max ${f(data.inputMax)}, ${data.inputs})` : 'input → frame —');
            if (report && q.has('stats')) send('/log', 'stats: ' + statsEl.textContent.replace(/\n/g, ' | '));
            monitorSend('stats ' + statsEl.textContent.replace(/\n/g, ' | '));
          },
          onCapture(frame, png) {
            if (report) fetch(`/capture/${frame}`, { method: 'POST', body: png }).catch(() => {});
          },
          onDone(status) {
            statusEl.hidden = false;
            statusEl.textContent = status === 0 ? 'The game has ended.' : typeof status === 'string' ? status : `The game stopped (status ${status}). See the log for details.`;
            monitorSend(`done status ${status}`);
            monitorFlush();
            player.soundStats().then((a) => {
              if (a) send('/log', a);
              send('/done', typeof status === 'string' ? status : `status ${status}`);
            });
            if (status === 0 && !testRun) back();
          },
        });
        document.getElementById('keysbtn').onclick = async () => {
          const r = await editKeymap(document.getElementById('keys'), game);
          if (r) player.setKeymap(r.map);
        };
        // &keytest=ms:code:1|0,...: real key events at those times (tests of the input path)
        for (const k of (q.get('keytest') ?? '').split(',').filter(Boolean)) {
          const [ms, code, down] = k.split(':');
          setTimeout(() => window.dispatchEvent(new KeyboardEvent(down === '1' ? 'keydown' : 'keyup', { code, bubbles: true })), Number(ms));
        }
      }
    </script>
  </body>
</html>
