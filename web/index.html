<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gmrecomp</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #101012;
        --panel: #1a1a1e;
        --line: #2c2c33;
        --fg: #ececf1;
        --muted: #8d8d99;
        --accent: #e8b44a;
        --stage: #000;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f4f3ef; --panel: #ffffff; --line: #dcdad3; --fg: #1d1c19; --muted: #6c6a62; --accent: #a8700f; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
      a { color: inherit; }
      button, label.button {
        font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 10px; cursor: pointer;
      }
      button:hover, label.button:hover { border-color: var(--muted); }
      [hidden] { display: none !important; }

      /* library */
      #library { max-width: 960px; margin: 0 auto; padding: 40px 16px 64px; }
      #library h1 { margin: 0; font: 600 26px/1.2 ui-monospace, monospace; letter-spacing: -0.02em; }
      #library h1 span { color: var(--accent); }
      #library .lede { margin: 6px 0 28px; color: var(--muted); }
      #games { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
      #games a {
        display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 16px; text-decoration: none;
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      }
      #games a:hover { border-color: var(--accent); }
      #games .title { font-weight: 600; font-size: 16px; }
      #games .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
      .badge { font: 12px/1 ui-monospace, monospace; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
      .badge.saved { color: var(--accent); border-color: currentColor; }
      #games li.unsupported a { opacity: 0.55; }
      #games li.unsupported a:hover { border-color: var(--line); }
      #empty { color: var(--muted); }

      /* player */
      #player { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--stage); }
      #bar {
        display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg);
        border-bottom: 1px solid var(--line); flex-wrap: wrap;
      }
      #bar .name { font-weight: 600; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #bar a.back { text-decoration: none; color: var(--muted); font-size: 13px; }
      #bar a.back:hover { color: var(--fg); }
      #stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
      #screen { display: block; image-rendering: pixelated; background: #000; }
      #status {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #b9b9c2;
        font: 13px/1.4 ui-monospace, monospace; text-align: center; max-width: 90%;
      }
      #hint {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px;
        background: rgba(20, 20, 24, 0.85); color: #d9d9e0; font-size: 13px; pointer-events: none;
      }
      #log {
        position: absolute; right: 0; top: 0; bottom: 0; width: min(520px, 100%); margin: 0; padding: 10px; overflow: auto;
        background: rgba(10, 10, 12, 0.92); color: #a9a9b3; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap;
      }
      #stats {
        position: absolute; left: 8px; top: 8px; margin: 0; padding: 6px 9px; border-radius: 6px; pointer-events: none;
        background: rgba(10, 10, 12, 0.8); color: #cfe9cf; font: 12px/1.45 ui-monospace, monospace; white-space: pre;
      }
      body.fullscreen #bar { display: none; }
    </style>
  </head>
  <body>
    <main id="library" hidden>
      <h1>gm<span>recomp</span></h1>
      <p class="lede">GameMaker games, recompiled from their original executables to run in the browser.</p>
      <ul id="games"></ul>
      <p id="empty" hidden>No games yet. Import some with <code>importer import … --out web/public/games</code>.</p>
    </main>

    <div id="player" hidden>
      <div id="bar">
        <a class="back" href="./">← Games</a>
        <span class="name" id="name"></span>
        <button id="scale" title="Integer scaling keeps pixels square and sharp">Scale: integer</button>
        <button id="export">Export saves</button>
        <label class="button" title="Load saves exported earlier (restarts the game)">Import saves<input id="import" type="file" accept=".json,application/json" hidden /></label>
        <button id="wipe">Delete saves</button>
        <button id="statsbtn" title="Frame rate, frame time and input latency">Stats</button>
        <button id="logbtn">Log</button>
        <button id="fs">Fullscreen</button>
      </div>
      <div id="stage">
        <canvas id="screen" width="640" height="480"></canvas>
        <div id="status">Loading…</div>
        <div id="hint" hidden>Click or press a key to turn on sound</div>
        <pre id="log" hidden></pre>
        <pre id="stats" hidden></pre>
      </div>
    </div>

    <script type="module">
      import { deleteSaves, exportSaves, loadSaves, openSaves, parseSaves, storeSaves } from './src/saves.mjs';
      import { KEYS } from './src/keys.mjs';

      // ?game=<slug> plays a game; test options: &frames=N &epoch=S &report=1 &capture=30,60
      // &stats (overlay) &pacing=clock|jit|asap (other frame pacing; the default follows the
      // guest's clock with blocking waits)
      // &nopace=1 &script=100:Enter:1,105:Enter:0 (or f:mouse:x:y:b) &audio=1 &nosave=1
      // &monitor: the dev server records the session (start, saves, input as the guest
      // took it, stats, slow frames) in target/monitor/, for `harness run --replay`
      // &replay=<session>: plays a recorded session again (its date, saves and input)
      const q = new URLSearchParams(location.search);
      const game = q.get('game');

      const runnable = (e) => e && (e.kind === 'gm80' || e.kind === 'gm81' || e.kind === 'gms');
      function engineLabel(e) {
        if (!e) return 'unknown engine';
        if (e.kind === 'gm80') return 'GameMaker 8.0';
        if (e.kind === 'gm81') return 'GameMaker 8.1';
        if (e.kind === 'gms') {
          const build = e.version && e.version[3] && e.version[3] !== 9999 ? `.${e.version[3]}` : '';
          return `GameMaker: Studio 1.4${build}${e.yyc ? ' · YYC' : ''}`;
        }
        return e.kind;
      }

      if (game) play(game);
      else library();

      async function library() {
        document.getElementById('library').hidden = false;
        let games = [];
        try {
          const r = await fetch('games/index.json');
          if (r.ok) games = await r.json();
        } catch {}
        const list = document.getElementById('games');
        document.getElementById('empty').hidden = games.length > 0;
        const badges = new Map();
        for (const g of games) {
          const li = document.createElement('li');
          const ok = runnable(g.engine);
          li.className = ok ? '' : 'unsupported';
          const a = document.createElement('a');
          a.href = `?game=${encodeURIComponent(g.slug)}`;
          const title = document.createElement('span');
          title.className = 'title';
          title.textContent = g.title || g.slug;
          const meta = document.createElement('span');
          meta.className = 'meta';
          const badge = (text, cls = '') => {
            const b = document.createElement('span');
            b.className = `badge ${cls}`;
            b.textContent = text;
            meta.append(b);
          };
          badge(engineLabel(g.engine));
          if (!ok) badge('not playable yet');
          a.append(title, meta);
          li.append(a);
          list.append(li);
          badges.set(g.slug, badge);
        }
        // Mark the games that have saves (after the list is up).
        try {
          const db = await openSaves();
          for (const [slug, badge] of badges) {
            loadSaves(db, slug).then((s) => s.some((e) => e.data) && badge('saved', 'saved')).catch(() => {});
          }
        } catch {}
      }

      async function play(game) {
        const frames = Number(q.get('frames') ?? 0);
        const epoch = q.has('epoch') ? Number(q.get('epoch')) : Math.floor(Date.now() / 1000);
        // (monitor: the session's first line, for replays)
        const report = q.has('report');
        const capture = (q.get('capture') ?? '').split(',').filter(Boolean).map(Number);
        const pace = !q.has('nopace');
        const persist = !q.has('nosave');
        const script = (q.get('script') ?? '').split(',').filter(Boolean).map((s) => {
          const p = s.split(':');
          if (p[1] === 'mouse') return [Number(p[0]), 'mouse', Number(p[2]), Number(p[3]), Number(p[4])];
          return [Number(p[0]), p[1], p[2] === '1', p[3] === 'n']; // frame:code:1|0[:n = NumLock on]
        });

        document.getElementById('player').hidden = false;
        const screen = document.getElementById('screen');
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');
        const hint = document.getElementById('hint');
        const send = (path, body) => report && fetch(path, { method: 'POST', body }).catch(() => {});
        send('/log', `userAgent: ${navigator.userAgent}\ncrossOriginIsolated: ${self.crossOriginIsolated}`);
        // Monitor mode: lines batched to the dev server every half second.
        const monitor = q.has('monitor');
        const session = `${game}-${new Date().toISOString().replace(/[:.]/g, '-')}`;
        let monitorLines = [];
        const monitorSend = (line) => monitor && monitorLines.push(line);
        const monitorFlush = () => {
          if (!monitorLines.length) return;
          const body = monitorLines.join('\n') + '\n';
          monitorLines = [];
          fetch(`/monitor?s=${encodeURIComponent(session)}`, { method: 'POST', body }).catch(() => {});
        };
        if (monitor) {
          setInterval(monitorFlush, 500);
          window.addEventListener('pagehide', monitorFlush);
        }

        let title = game;
        fetch(`games/${encodeURIComponent(game)}/manifest.json`)
          .then((r) => r.json())
          .then((m) => {
            title = m.title || game;
            document.getElementById('name').textContent = title;
            document.title = `${title} · gmrecomp`;
          })
          .catch(() => {});

        // Scaling: the largest whole multiple that fits (or any fit), centered.
        let gameW = 640, gameH = 480;
        let integer = true;
        const fit = () => {
          const stage = document.getElementById('stage').getBoundingClientRect();
          let s = Math.min(stage.width / gameW, stage.height / gameH);
          if (integer && s >= 1) s = Math.floor(s);
          screen.style.width = `${Math.max(1, Math.round(gameW * s))}px`;
          screen.style.height = `${Math.max(1, Math.round(gameH * s))}px`;
        };
        window.addEventListener('resize', fit);
        document.getElementById('scale').onclick = (e) => {
          integer = !integer;
          e.target.textContent = `Scale: ${integer ? 'integer' : 'fit'}`;
          fit();
        };
        document.getElementById('fs').onclick = () => document.getElementById('player').requestFullscreen?.();
        document.addEventListener('fullscreenchange', () => {
          document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
          requestAnimationFrame(fit);
        });
        document.getElementById('logbtn').onclick = () => (logEl.hidden = !logEl.hidden);
        // Stats overlay (remembered per browser; ?stats shows it too).
        const statsEl = document.getElementById('stats');
        const remember = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
        const recall = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
        statsEl.hidden = !(q.has('stats') || recall('gmr.stats') === '1');
        document.getElementById('statsbtn').onclick = () => {
          statsEl.hidden = !statsEl.hidden;
          remember('gmr.stats', statsEl.hidden ? '0' : '1');
        };
        if (q.has('log')) logEl.hidden = false;
        fit();

        // Saves.
        const saveDb = persist ? openSaves().catch(() => null) : Promise.resolve(null);
        document.getElementById('export').onclick = async () => {
          const db = await saveDb;
          const saves = db ? await loadSaves(db, game) : [];
          if (!saves.length) return alert('This game has no saves yet.');
          const url = URL.createObjectURL(new Blob([exportSaves(game, saves)], { type: 'application/json' }));
          const a = Object.assign(document.createElement('a'), { href: url, download: `${game}-saves.json` });
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
        document.getElementById('import').onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          try {
            const entries = parseSaves(await file.text(), game);
            const db = await saveDb;
            if (!db) throw new Error('saves are not available in this browser');
            if (!confirm(`Replace this game's saves with ${file.name} and restart?`)) return;
            await deleteSaves(db, game);
            await storeSaves(db, game, entries);
            location.reload();
          } catch (err) {
            alert(`Could not import: ${err.message}`);
          }
        };
        document.getElementById('wipe').onclick = async () => {
          const db = await saveDb;
          if (!db || !confirm(`Delete every save of ${title} and restart?`)) return;
          await deleteSaves(db, game);
          location.reload();
        };

        // Sound starts with the first user gesture (browser autoplay rules); audio=1
        // starts it without one (tests, with autoplay allowed).
        let audio = null;
        let audioStarted = false;
        let audioNode = null;
        const startAudio = async () => {
          if (audioStarted || !audio) return;
          audioStarted = true;
          try {
            const ctx = new AudioContext({ sampleRate: audio.rate, latencyHint: 0.005 }); // as low as the system allows
            await ctx.audioWorklet.addModule('src/audio-worklet.js');
            // the queue starts at what the system's audio period needs (see the worklet)
            const latency = Math.max(0.015, (ctx.baseLatency || 0) + 0.01);
            const node = new AudioWorkletNode(ctx, 'ring-player', { outputChannelCount: [2], processorOptions: { sab: audio.sab, frames: audio.frames, latency } });
            node.connect(ctx.destination);
            audioNode = node;
            // Skip what piled up before the user enabled sound.
            const idx = new Int32Array(audio.sab, 0, 2);
            Atomics.store(idx, 1, Atomics.load(idx, 0));
            hint.hidden = true;
          } catch (e) {
            audioStarted = false;
            send('/log', `audio failed: ${e}`);
          }
        };
        for (const t of ['pointerdown', 'keydown']) window.addEventListener(t, startAudio);
        const audioStats = () => !audioNode ? Promise.resolve(audioStarted ? 'audio: not running' : null) : new Promise((res) => {
          audioNode.port.onmessage = ({ data: a }) => {
            const rms = Math.sqrt(a.sumsq / Math.max(1, 2 * a.played));
            const s = (f) => `${(f / audio.rate).toFixed(2)}s`;
            res(`audio: played ${s(a.played)}, ${a.underruns} underruns (${s(a.starved)} silent), skipped ${s(a.skipped)}, rms ${rms.toFixed(4)}, context ${audioNode.context.state} at ${audioNode.context.sampleRate} Hz, output latency ${((audioNode.context.outputLatency ?? 0) * 1000).toFixed(1)} ms, base latency ${((audioNode.context.baseLatency ?? 0) * 1000).toFixed(1)} ms, target ${(a.target * 1000).toFixed(1)} ms; first sound at ${a.start.toFixed(2)}s, now ${audioNode.context.currentTime.toFixed(2)}s, underruns at ${a.events.join(' ')}`);
          };
          audioNode.port.postMessage(0);
        });

        const w = new Worker('src/worker.mjs', { type: 'module' });
        w.onmessage = ({ data }) => {
          if (data.type === 'log') {
            logEl.textContent += data.line + '\n';
            send('/log', data.line);
            monitorSend(`log ${data.line}`);
            if (data.line.startsWith('downloaded')) statusEl.textContent = 'Starting…';
          } else if (data.type === 'audio') {
            audio = data;
            if (q.has('audio')) startAudio();
            else if (!audioStarted) hint.hidden = false;
          } else if (data.type === 'size') {
            [gameW, gameH] = [data.w, data.h];
            statusEl.hidden = true;
            fit();
          } else if (data.type === 'monitor') {
            monitorSend(data.line);
          } else if (data.type === 'stats') {
            const f = (v) => v.toFixed(1);
            statsEl.textContent =
              `${f(data.fps)} fps   frame ${f(data.interval)} ms (max ${f(data.intervalMax)})\n` +
              `guest ${f(data.busy)} ms per frame (max ${f(data.busyMax)})   late ${data.late}   wake +${f(data.wake)} ms (max ${f(data.wakeMax)})\n` +
              (data.inputs ? `input → frame ${f(data.input)} ms (max ${f(data.inputMax)}, ${data.inputs})` : 'input → frame —');
            if (report && q.has('stats')) send('/log', 'stats: ' + statsEl.textContent.replace(/\n/g, ' | '));
            monitorSend('stats ' + statsEl.textContent.replace(/\n/g, ' | '));
          } else if (data.type === 'capture') {
            if (report) fetch(`/capture/${data.frame}`, { method: 'POST', body: data.png }).catch(() => {});
          } else if (data.type === 'done') {
            statusEl.hidden = false;
            statusEl.textContent = data.status === 0 ? 'The game has ended.' : `The game stopped (status ${data.status}). See the log for details.`;
            monitorSend(`done status ${data.status}`);
            monitorFlush();
            audioStats().then((a) => {
              if (a) send('/log', a);
              send('/done', `status ${data.status}`);
            });
          }
        };
        w.onerror = (e) => {
          statusEl.hidden = false;
          statusEl.textContent = `worker error: ${e.message}`;
          send('/done', `worker error: ${e.message}`);
        };
        statusEl.textContent = 'Downloading…';
        const offscreen = screen.transferControlToOffscreen();
        const pacing = ['asap', 'jit', 'clock'].includes(q.get('pacing')) ? q.get('pacing') : 'sync';
        const ahead = !q.has('noahead');
        // a recorded session to replay: its date, saves and input
        let replay = null;
        let runEpoch = epoch;
        if (q.has('replay')) {
          const text = await (await fetch(`/monitor/${encodeURIComponent(q.get('replay'))}.log`)).text();
          replay = { saves: [], input: [] };
          const unhex = (h) => Uint8Array.from({ length: h.length >> 1 }, (_, i) => parseInt(h.substr(2 * i, 2), 16));
          for (const line of text.split('\n')) {
            const w = line.split(' ');
            if (w[0] === 'start') runEpoch = Number((w.find((t) => t.startsWith('epoch=')) ?? 'epoch=0').slice(6)) || epoch;
            else if (w[0] === 'save') replay.saves.push({ path: w[1].replaceAll('%20', ' '), data: unhex(w[2] ?? ''), mtime: 0 });
            else if (w[0] === 'deleted') replay.saves.push({ path: w[1].replaceAll('%20', ' '), data: null, mtime: 0 });
            else if (w[0] === 'input' && (w[3] === 'key' || w[3] === 'mouse')) replay.input.push([w[3] === 'key' ? 0 : 1, Number(w[1]), Number(w[2]), ...w.slice(4, 7).map(Number)]);
          }
        }
        monitorSend(`start game=${game} epoch=${runEpoch} ua=${navigator.userAgent.replaceAll(' ', '_')}`);
        const slowMs = q.has('slow') ? Number(q.get('slow')) : undefined;
        // Keys go to the worker through a shared ring (written here as they happen, read
        // at the guest's message polls): [write, read], then 256 × [vk, scan, down] and
        // 256 event times.
        const inputRing = new SharedArrayBuffer(8 + 256 * 12 + 256 * 8);
        const ringIdx = new Int32Array(inputRing, 0, 2);
        const ringEv = new Int32Array(inputRing, 8, 256 * 3);
        const ringWhen = new Float64Array(inputRing, 8 + 256 * 12, 256);
        const sendKey = (code, down, numlock, when) => {
          const k = KEYS[code];
          if (!k) return;
          const wr = Atomics.load(ringIdx, 0);
          if (((wr - Atomics.load(ringIdx, 1)) | 0) >= 256) return; // the guest is not reading
          const i = wr & 255;
          // the NumLock state decides what the keypad sends (see the runtime's numpad_key)
          ringEv.set([k[0], k[1] | (numlock ? 0x200 : 0), down ? 1 : 0], i * 3);
          ringWhen[i] = when ?? performance.timeOrigin + performance.now();
          Atomics.store(ringIdx, 0, (wr + 1) | 0);
        };
        w.postMessage({ game, frames, epoch: runEpoch, canvas: offscreen, capture, pace, pacing, ahead, script, persist: persist && !replay, monitor, replay, slowMs, inputRing }, [offscreen]);

        // Input goes to the worker as it happens; the runtime applies it at the guest's
        // next message poll.
        const gameKeys = /^(Arrow|Space|Tab|Backspace|F\d|Enter|Shift|Control|Alt|Key|Digit|Escape|Numpad|Page|Home|End|Insert|Delete)/;
        for (const type of ['keydown', 'keyup']) {
          window.addEventListener(type, (e) => {
            if (e.target instanceof HTMLInputElement) return;
            if (gameKeys.test(e.code) && !e.metaKey && e.code !== 'F11') e.preventDefault();
            if (e.repeat) return;
            const numlock = e.getModifierState ? e.getModifierState('NumLock') : true;
            sendKey(e.code, type === 'keydown', numlock, performance.timeOrigin + e.timeStamp);
          });
        }
        window.addEventListener('blur', () => {
          // Releasing everything avoids keys stuck down after switching away.
          for (const code of ['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'KeyZ', 'KeyX', 'KeyR', 'KeyS'])
            sendKey(code, false, true);
        });
        const mouse = (e) => {
          const r = screen.getBoundingClientRect();
          const buttons = (e.buttons & 1) | ((e.buttons & 2) ? 2 : 0) | ((e.buttons & 4) ? 4 : 0);
          const t = e.type === 'mousemove' ? undefined : performance.timeOrigin + e.timeStamp;
          w.postMessage({ type: 'mouse', x: (e.clientX - r.left) * (gameW / r.width), y: (e.clientY - r.top) * (gameH / r.height), buttons, t });
        };
        for (const t of ['mousemove', 'mousedown', 'mouseup']) screen.addEventListener(t, mouse);

        // Game controllers (the standard layout matches an Xbox controller): XInput state,
        // sent when it changes.
        const PAD_BUTTONS = { 0: 0x1000, 1: 0x2000, 2: 0x4000, 3: 0x8000, 4: 0x0100, 5: 0x0200, 8: 0x0020, 9: 0x0010, 10: 0x0040, 11: 0x0080, 12: 0x1, 13: 0x2, 14: 0x4, 15: 0x8 };
        const padLast = ['', '', '', ''];
        const axis = (v) => Math.max(-32768, Math.min(32767, Math.round((v ?? 0) * 32767)));
        const pollPads = () => {
          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (let i = 0; i < 4; i++) {
            const g = pads[i];
            let state;
            if (g && g.connected) {
              let buttons = 0;
              for (const [k, bit] of Object.entries(PAD_BUTTONS)) if (g.buttons[k]?.pressed) buttons |= bit;
              const trig = (k) => Math.round(255 * (g.buttons[k]?.value ?? 0));
              state = { connected: true, buttons, lt: trig(6), rt: trig(7), lx: axis(g.axes[0]), ly: axis(-(g.axes[1] ?? 0)), rx: axis(g.axes[2]), ry: axis(-(g.axes[3] ?? 0)) };
            } else state = { connected: false, buttons: 0, lt: 0, rt: 0, lx: 0, ly: 0, rx: 0, ry: 0 };
            const key = JSON.stringify(state);
            if (key !== padLast[i]) {
              padLast[i] = key;
              w.postMessage({ type: 'pad', index: i, ...state });
            }
          }
          requestAnimationFrame(pollPads);
        };
        requestAnimationFrame(pollPads);
        screen.addEventListener('contextmenu', (e) => e.preventDefault());
        // &keytest=ms:code:1|0,...: real key events at those times (tests of the input path)
        for (const k of (q.get('keytest') ?? '').split(',').filter(Boolean)) {
          const [ms, code, down] = k.split(':');
          setTimeout(() => window.dispatchEvent(new KeyboardEvent(down === '1' ? 'keydown' : 'keyup', { code, bubbles: true })), Number(ms));
        }
      }
    </script>
  </body>
</html>
