[package]
name = "recomp"
edition.workspace = true
version.workspace = true
description = "The x86 to WebAssembly translator"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
fpu = { version = "0.1.0", path = "../fpu" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info", "fast_fmt"] }
pe = { version = "0.1.0", path = "../pe" }
wasm-encoder = "0.262.0"
x86 = { version = "0.1.0", path = "../x86" }
