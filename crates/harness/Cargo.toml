[package]
name = "harness"
edition.workspace = true
version.workspace = true
description = "Runs the runtime natively on wasmtime: games headless, state hashes, traces, CPU differential tests"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fpu = { version = "0.1.0", path = "../fpu" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "code_asm", "fast_fmt", "instr_info", "op_code_info"] }
pe = { version = "0.1.0", path = "../pe" }
rand = "0.10.3"
recomp = { version = "0.1.0", path = "../recomp" }
runtime = { version = "0.1.0", path = "../runtime" }
serde_json = "1.0.154"
wasm-encoder = "0.262.0"
wasmparser = "0.262.0"
wasmprinter = "0.262.0"
wasmtime = { version = "50.0.0", default-features = false, features = ["cranelift", "runtime", "std", "cache", "parallel-compilation"] }
x86 = { version = "0.1.0", path = "../x86" }
