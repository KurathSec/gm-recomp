[package]
name = "runtime"
edition.workspace = true
version.workspace = true
description = "PE loader, process state, the Windows API implementations and the engine that runs translated code"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
encoding_rs = "0.8.42"
fpu = { version = "0.1.0", path = "../fpu" }
libm = "0.2.16"
md5 = "0.7"
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
recomp = { version = "0.1.0", path = "../recomp" }
wasm-encoder = "0.262.0"
pe = { version = "0.1.0", path = "../pe" }
x86 = { version = "0.1.0", path = "../x86" }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3"] }
rustysynth = "1.3.8"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
