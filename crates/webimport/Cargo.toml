[package]
name = "webimport"
edition.workspace = true
version.workspace = true
description = "The importer's unpacking and engine detection, built for the page"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
delharc = "0.8"
encoding_rs = "0.8.42"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "optimization"] }
lzxd = "0.2"
pe = { version = "0.1.0", path = "../pe" }
runtime = { version = "0.1.0", path = "../runtime" }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.24", default-features = false }
rars = { version = "0.11", default-features = false }
