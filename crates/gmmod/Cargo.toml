[package]
name = "gmmod"
edition.workspace = true
version.workspace = true
description = "Mods applied to GameMaker games' files before they run (a debug switch, Fangame.ModLoader's mods)"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.154"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
png = "0.17"
md5 = "0.7"
