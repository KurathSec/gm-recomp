name: CI

on:
  push:
  pull_request:

jobs:
  native:
    name: Unit and CPU differential tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: 32-bit gcc (the CPU reference program)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Unit tests
        run: cargo test --release --workspace
      - name: CPU differential tests (translated code vs. the host CPU)
        run: cargo run --release -p harness -- cpu-diff --mode x87fast --count 5000

  wasm:
    name: Browser builds
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Runtime
        run: cargo build --release --target wasm32-unknown-unknown -p web --target-dir target/wasm
      - name: Importer
        run: cargo build --release --target wasm32-unknown-unknown -p webimport --target-dir target/wasm-import
      - name: Mods
        run: cargo build --release --target wasm32-unknown-unknown -p gmmod --target-dir target/wasm-mods
